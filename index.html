
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sam's Xpress Scheduler — Sprint 4 Prototype</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useMemo } = React;

    const SectionHeader = ({ title, right }) => (
      <div className="flex items-end justify-between border-b pb-3 mb-4">
        <h2 className="text-xl font-semibold">{title}</h2>
        {right}
      </div>
    );

    const Card = ({ children, className = "" }) => (
      <div className={"bg-white rounded-2xl shadow-sm border p-4 " + className}>{children}</div>
    );

    const Input = ({ label, type = "text", ...props }) => (
      <label className="flex flex-col gap-1 text-sm">
        <span className="text-gray-600">{label}</span>
        <input type={type} className="rounded-xl border px-3 py-2 focus:outline-none focus:ring-2" {...props} />
      </label>
    );

    const Select = ({ label, children, ...props }) => (
      <label className="flex flex-col gap-1 text-sm">
        <span className="text-gray-600">{label}</span>
        <select className="rounded-xl border px-3 py-2 focus:outline-none focus:ring-2" {...props}>
          {children}
        </select>
      </label>
    );

    const TextArea = ({ label, rows = 3, ...props }) => (
      <label className="flex flex-col gap-1 text-sm">
        <span className="text-gray-600">{label}</span>
        <textarea rows={rows} className="rounded-xl border px-3 py-2 focus:outline-none focus:ring-2" {...props} />
      </label>
    );

    const Button = ({ children, variant = "primary", ...props }) => {
      const styles = {
        primary: "bg-black text-white hover:opacity-90 border-black",
        ghost: "bg-transparent border hover:bg-gray-50",
        soft: "bg-gray-100 hover:bg-gray-200 border-gray-200",
      };
      return (
        <button className={`rounded-xl px-3 py-2 text-sm border ${styles[variant]}`} {...props}>
          {children}
        </button>
      );
    };

    const Weekdays = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
    const Roles = ["Attendant","Detailer","Cashier","Supervisor"];

    function ScreenSubmitAvailability() {
      const [rows, setRows] = useState(() => Weekdays.map((d) => ({ day: d, from: "", to: "" })));
      return (
        <Card>
          <SectionHeader title="Submit Availability" right={<Button>Save</Button>} />
          <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
            {rows.map((r, idx) => (
              <Card key={r.day} className="flex items-center gap-3">
                <div className="w-14 font-medium">{r.day}</div>
                <Input label="From" type="time" value={r.from} onChange={(e)=>{
                  const copy=[...rows]; copy[idx].from=e.target.value; setRows(copy);
                }} />
                <Input label="To" type="time" value={r.to} onChange={(e)=>{
                  const copy=[...rows]; copy[idx].to=e.target.value; setRows(copy);
                }} />
              </Card>
            ))}
          </div>
        </Card>
      );
    }

    function ScreenRequestTimeOff() {
      return (
        <Card>
          <SectionHeader title="Request Time Off" right={<Button>Submit</Button>} />
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <Input label="Start Date" type="date" />
            <Input label="End Date" type="date" />
            <Select label="Reason">
              <option>Personal</option>
              <option>Medical</option>
              <option>Vacation</option>
            </Select>
          </div>
          <div className="mt-4 grid grid-cols-1 md:grid-cols-2 gap-4">
            <TextArea label="Notes for Manager" />
          </div>
        </Card>
      );
    }

    function ScreenViewSchedule() {
      const [weekOffset, setWeekOffset] = useState(0);
      const dates = useMemo(() => Weekdays.map((d,i)=>({ label: d, date: `6/${10+i+weekOffset*7}` })), [weekOffset]);
      return (
        <Card>
          <SectionHeader title="My Schedule" right={
            <div className="flex gap-2">
              <Button variant="soft" onClick={()=>setWeekOffset(weekOffset-1)}>Prev</Button>
              <Button variant="soft" onClick={()=>setWeekOffset(0)}>This Week</Button>
              <Button variant="soft" onClick={()=>setWeekOffset(weekOffset+1)}>Next</Button>
            </div>
          } />
          <div className="grid grid-cols-1 md:grid-cols-7 gap-3">
            {dates.map((d) => (
              <Card key={d.label} className="space-y-2">
                <div className="font-medium">{d.label}</div>
                <div className="text-xs text-gray-500">{d.date}</div>
                <div className="rounded-lg border p-2 text-sm">Shift: 9:00–17:00<br/>Role: Attendant</div>
              </Card>
            ))}
          </div>
        </Card>
      );
    }

    function ScreenReviewTimeOff() {
      const [filter, setFilter] = useState("Pending");
      const data = [
        { id: 101, name: "Alex Kim", range: "Jun 12–13", status: "Pending" },
        { id: 102, name: "Jordan Lee", range: "Jun 15", status: "Pending" },
        { id: 103, name: "Sam Patel", range: "Jun 20", status: "Approved" },
      ].filter((r) => (filter === "All" ? true : r.status === filter));
      return (
        <Card>
          <SectionHeader title="Decide Time-Off" right={
            <Select label="Filter" value={filter} onChange={(e)=>setFilter(e.target.value)}>
              <option>Pending</option>
              <option>Approved</option>
              <option>Denied</option>
              <option>All</option>
            </Select>
          } />
          <div className="overflow-auto">
            <table className="min-w-full text-sm">
              <thead>
                <tr className="text-left text-gray-600">
                  <th className="py-2">Employee</th>
                  <th className="py-2">Dates</th>
                  <th className="py-2">Status</th>
                  <th className="py-2">Action</th>
                </tr>
              </thead>
              <tbody>
                {data.map((r) => (
                  <tr key={r.id} className="border-t">
                    <td className="py-2">{r.name}</td>
                    <td className="py-2">{r.range}</td>
                    <td className="py-2">
                      <span className={
                        "px-2 py-0.5 rounded-full text-xs border " +
                        (r.status === 'Pending' ? 'bg-yellow-50 border-yellow-200' : r.status === 'Approved' ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200')
                      }>{r.status}</span>
                    </td>
                    <td className="py-2 flex gap-2">
                      <Button variant="soft">Approve</Button>
                      <Button variant="ghost">Deny</Button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </Card>
      );
    }

    function ScreenConflictChecker() {
      const rows = [
        { id: 1, type: "Overstaffed", when: "Tue 10:00–12:00", detail: "3 scheduled / need 2" },
        { id: 2, type: "Understaffed", when: "Sat 12:00–18:00", detail: "1 scheduled / need 3" },
        { id: 3, type: "Time-Off", when: "Fri 09:00–17:00", detail: "Alex K has approved PTO" },
      ];
      return (
        <Card>
          <SectionHeader title="Check Conflicts" right={<Button variant="soft">Re-run Check</Button>} />
          <div className="space-y-2">
            {rows.map((r) => (
              <div key={r.id} className="flex items-start justify-between border rounded-xl p-3">
                <div>
                  <div className="font-medium">{r.type}</div>
                  <div className="text-sm text-gray-600">{r.when}</div>
                  <div className="text-sm mt-1">{r.detail}</div>
                </div>
                <div className="flex gap-2">
                  <Button variant="soft">Suggest Fix</Button>
                  <Button variant="ghost">Dismiss</Button>
                </div>
              </div>
            ))}
          </div>
        </Card>
      );
    }

    function ScreenScheduleBuilder() {
      const [role, setRole] = useState("Attendant");
      const [weekOffset, setWeekOffset] = useState(0);
      const hours = ["9a","10a","11a","12p","1p","2p","3p","4p","5p"];
      return (
        <Card>
          <SectionHeader title="Build & Publish Schedule" right={
            <div className="flex gap-2">
              <Button variant="ghost">Save Draft</Button>
              <Button>Publish Week</Button>
            </div>
          } />

          <div className="grid md:grid-cols-4 gap-4">
            <Card className="md:col-span-1 space-y-3">
              <Select label="Role" value={role} onChange={(e)=>setRole(e.target.value)}>
                {Roles.map(r => <option key={r}>{r}</option>)}
              </Select>
              <div className="flex gap-2">
                <Button variant="soft" onClick={()=>setWeekOffset(weekOffset-1)}>Prev</Button>
                <Button variant="soft" onClick={()=>setWeekOffset(0)}>This Week</Button>
                <Button variant="soft" onClick={()=>setWeekOffset(weekOffset+1)}>Next</Button>
              </div>
              <TextArea label="Notes / Constraints" rows={5} />
            </Card>

            <Card className="md:col-span-3 overflow-auto">
              <div className="grid grid-cols-9 gap-2 min-w-[700px]">
                <div className="font-medium">&nbsp;</div>
                {Weekdays.map(d => <div key={d} className="font-medium text-center">{d}</div>)}
                {hours.map(h => (
                  <React.Fragment key={"row-"+h}>
                    <div className="text-sm text-gray-600 flex items-center">{h}</div>
                    {Weekdays.map(d => (
                      <div key={`${d}-${h}`} className="h-12 rounded-lg border bg-gradient-to-br from-blue-50 to-white flex items-center justify-center text-xs">
                        + Assign
                      </div>
                    ))}
                  </React.Fragment>
                ))}
              </div>
            </Card>
          </div>

          <div className="mt-4">
            <ScreenConflictChecker />
          </div>
        </Card>
      );
    }

    const EMP_SCREENS = {
      "Submit Availability": <ScreenSubmitAvailability />,
      "Request Time Off": <ScreenRequestTimeOff />,
      "View My Schedule": <ScreenViewSchedule />,
    };

    const MGR_SCREENS = {
      "Review Time-Off": <ScreenReviewTimeOff />,
      "Schedule Builder": <ScreenScheduleBuilder />,
    };

    function App() {
      const [mode, setMode] = useState("Manager");
      const [screen, setScreen] = useState("Schedule Builder");
      const menu = mode === "Manager" ? MGR_SCREENS : EMP_SCREENS;

      return (
        <div className="min-h-screen">
          <header className="sticky top-0 z-10 bg-white border-b">
            <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-8 h-8 rounded-xl bg-black text-white flex items-center justify-center">SX</div>
                <h1 className="text-lg font-semibold">Sam's Xpress Scheduler</h1>
              </div>
              <div className="flex gap-2">
                <Button variant={mode === "Employee" ? "primary" : "soft"} onClick={()=>{setMode("Employee"); setScreen("Submit Availability");}}>Employee</Button>
                <Button variant={mode === "Manager" ? "primary" : "soft"} onClick={()=>{setMode("Manager"); setScreen("Schedule Builder");}}>Manager</Button>
              </div>
            </div>
          </header>

          <main className="max-w-6xl mx-auto px-4 py-6 grid md:grid-cols-[220px_1fr] gap-6">
            <Card className="h-fit sticky top-20">
              <div className="flex flex-col gap-2">
                {Object.keys(menu).map((k) => (
                  <Button key={k} variant={screen === k ? "primary" : "ghost"} onClick={()=>setScreen(k)}>{k}</Button>
                ))}
              </div>
            </Card>

            <div className="space-y-6">{menu[screen]}</div>
          </main>

          <footer className="border-t py-6 text-center text-xs text-gray-500"></footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
